<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: draw under the notch / home indicator; safe areas are padded in CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1120" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Run your gym: members, memberships, payments and attendance."
    />

    <!-- Installable app (Android / desktop Chrome & Edge) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iOS home-screen app -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym Manager" />
    <meta name="format-detection" content="telephone=no" />

    <title>Gym Management SaaS</title>
    <style>
      /* Splash shown until React mounts, so the app never flashes a blank white page. */
      body {
        margin: 0;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b1120;
      }
      #boot img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(0.92);
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><img src="/icons/icon-192.png" alt="" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
